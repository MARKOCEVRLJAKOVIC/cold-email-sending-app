# Opt-in monitoring stack. Run together with the main stack:
#   docker compose -f docker-compose.yaml -f docker-compose.monitoring.yaml up -d
# Prometheus and Grafana bind to 127.0.0.1 only; reach them over an SSH tunnel:
#   ssh -L 3000:localhost:3000 -L 9090:localhost:9090 <user>@<host>

# YAML anchors don't carry across compose files, so this repeats the main file's logging block
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: prometheus
    restart: always
    logging: *default-logging
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=1GB
    volumes:
      - ./monitoring/prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      - email-app-net
    mem_limit: 200m

  grafana:
    image: grafana/grafana-oss:11.1.0
    container_name: grafana
    restart: always
    logging: *default-logging
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
    networks:
      - email-app-net
    mem_limit: 150m

volumes:
  prometheus_data:
  grafana_data:
