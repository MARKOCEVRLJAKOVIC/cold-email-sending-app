spring:
  config:
    activate:
      on-profile: prod

  application:
    name: EmailSenderWeb

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            redirect-uri: ${APP_URL}/login/oauth2/code/{registrationId}
            scope:
              - email
              - profile
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${CONFIRMATION_EMAIL}
    password: ${EMAIL_SECRET_APP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  datasource:
    url: jdbc:mysql://${DB_HOST:mysql}:3306/${DB_NAME:email_sender}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 30
      minimum-idle: 10
      idle-timeout: 300000
      max-lifetime: 1800000
      connection-timeout: 30000

  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: 6379

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        order_inserts: true

  jwt:
    secret: ${JWT_SECRET_KEY}
    accessTokenExpiration: 7200
    refreshTokenExpiration: 604800

  token:
    encrypt: ${TOKEN_ENCRYPTION_KEY}

email:
  follow-up:
    quantity: 2
    expiration: 48h
    cron: "0 0 * * * *"
  scheduling:
    default-delay-seconds: 15
    retry:
      max-attempts: 3

google:
  oauth2:
    client-id: ${GMAIL_CLIENT_ID}
    client-secret: ${GMAIL_CLIENT_SECRET}
    redirect-uri: ${FRONTEND_URL}/oauth2callback
    scope: https://mail.google.com/
  smtp:
    host: smtp.gmail.com
    port: 587
    type: GMAIL

app:
  url: ${APP_URL}
  frontend-url: ${FRONTEND_URL}
  frontend-login: ${FRONTEND_LOGIN}
  async:
    core-pool-size: 20
    max-pool-size: 50
    queue-capacity: 1000
    thread-name-prefix: "EmailSender-"

management:
  # Internal only: not published by compose and not proxied by nginx
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
  endpoint:
    health:
      show-details: never