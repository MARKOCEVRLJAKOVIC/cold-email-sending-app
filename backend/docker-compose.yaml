services:
  mysql:
    image: mysql:8.0.42
    container_name: mysql
    restart: always

    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: email_sender
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_HOST: "%"
    command: >
      --innodb-buffer-pool-size=128M
      --max-connections=50
      --innodb-log-buffer-size=16M
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - email-app-net
    deploy:
      resources:
        limits:
          memory: 300m

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: always
    command: redis-server --maxmemory 100mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - email-app-net
    deploy:
      resources:
        limits:
          memory: 150m

  backend:
    image: cevrljakovic/email-backend
    container_name: backend
    restart: always
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: docker
      JAVA_OPTS: "-Xms256m -Xmx350m"
    depends_on:
      - mysql
      - redis
    networks:
      - email-app-net
    deploy:
      resources:
        limits:
          memory: 400m

  frontend:
    image: cevrljakovic/email-frontend
    container_name: frontend
    restart: always
    networks:
      - email-app-net

  nginx:
    image: nginx:stable-alpine
    container_name: nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - backend
      - frontend
    networks:
      - email-app-net
    deploy:
      resources:
        limits:
          memory: 100m

volumes:
  mysql_data:
  redis_data:

networks:
  email-app-net: