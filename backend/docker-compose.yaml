services:

  mysql:
    image: mysql:8.0.42
    container_name: mysql
    restart: always
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: email_sender
      MYSQL_PASSWORD: ${DB_PASSWORD}
    command: >
      --innodb-buffer-pool-size=128M
      --max-connections=50
      --innodb-log-buffer-size=16M
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - email-app-net
    mem_limit: 300m
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: always
    command: redis-server --maxmemory 100mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - email-app-net
    mem_limit: 150m

  backend:
    image: cevrljakovic/email-backend
    container_name: backend
    restart: always
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      JAVA_TOOL_OPTIONS: "-Xms256m -Xmx350m"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - email-app-net
    mem_limit: 400m
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    image: cevrljakovic/email-frontend
    container_name: frontend
    restart: always
    networks:
      - email-app-net
    mem_limit: 150m

  nginx:
    image: nginx:stable-alpine
    container_name: nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    networks:
      - email-app-net
    mem_limit: 100m

volumes:
  mysql_data:
  redis_data:

networks:
  email-app-net: